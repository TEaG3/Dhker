name: dhker
description: ذِكر — مواقيت الصلاة والأذكار
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  adhan: ^2.0.0
  shared_preferences: ^2.2.3
  google_fonts: ^6.2.1
  qcf_quran_lite: ^0.0.6
  scrollable_positioned_list: ^0.3.8
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  audioplayers: ^6.0.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/cities.json
    - assets/data/adhkar.json
    - assets/data/references.json
