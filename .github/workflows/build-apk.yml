name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Analyze, test, and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up stable Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true

      - name: Verify Android release signing secrets
        if: github.ref == 'refs/heads/main'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required repository secret: $name"
              exit 1
            fi
          done

      - name: Decode Android release keystore
        if: github.ref == 'refs/heads/main'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/dhker-upload-key.jks"
          chmod 600 "$RUNNER_TEMP/dhker-upload-key.jks"
          test -s "$RUNNER_TEMP/dhker-upload-key.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/dhker-upload-key.jks" >> "$GITHUB_ENV"

      - name: Validate Android release keystore and key password
        if: github.ref == 'refs/heads/main'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if ! keytool -list -keystore "$ANDROID_KEYSTORE_FILE" -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not a valid keystore, or ANDROID_KEYSTORE_PASSWORD is incorrect."
            exit 1
          fi
          if ! keytool -certreq -alias "$ANDROID_KEY_ALIAS" -keystore "$ANDROID_KEYSTORE_FILE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" -file "$RUNNER_TEMP/dhker-signing-check.csr" >/dev/null 2>&1; then
            echo "::error::Keystore is readable, but ANDROID_KEY_ALIAS or ANDROID_KEY_PASSWORD is incorrect, or the alias is not a private-key entry."
            exit 1
          fi
          rm -f "$RUNNER_TEMP/dhker-signing-check.csr"
          echo "Android release keystore and private-key password validated."

      - name: Normalize Android keystore for Gradle
        if: github.ref == 'refs/heads/main'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          normalized="$RUNNER_TEMP/dhker-release-signing.jks"
          keytool -importkeystore -noprompt \\
            -srckeystore "$ANDROID_KEYSTORE_FILE" \\
            -srcstoretype PKCS12 \\
            -srcstorepass "$ANDROID_KEYSTORE_PASSWORD" \\
            -srcalias "$ANDROID_KEY_ALIAS" \\
            -srckeypass "$ANDROID_KEY_PASSWORD" \\
            -destkeystore "$normalized" \\
            -deststoretype JKS \\
            -deststorepass "$ANDROID_KEY_PASSWORD" \\
            -destkeypass "$ANDROID_KEY_PASSWORD"
          chmod 600 "$normalized"
          keytool -list -keystore "$normalized" -storetype JKS -storepass "$ANDROID_KEY_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_FILE=$normalized" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Show tool versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Prepare offline Kiwifu adhan audio library
        run: |
          mkdir -p assets/adhan android/app/src/main/res/raw
          download_adhan() {
            python3 - "$1" "$2" <<'PY'
          import sys
          from urllib.parse import quote
          from urllib.request import urlopen

          source_name, target_name = sys.argv[1], sys.argv[2]
          url = "https://raw.githubusercontent.com/Kiwifu/adhan-mp3/main/" + quote(source_name, safe="")
          with urlopen(url, timeout=90) as response:
              data = response.read()
          if len(data) < 1024:
              raise SystemExit(f"Downloaded audio is unexpectedly small: {source_name}")
          with open(target_name, "wb") as output:
              output.write(data)
          print(f"Downloaded {source_name} ({len(data)} bytes)")
          PY
          }
          download_adhan "Muhammad_Ramadan_Saad_-_Al_Haram_Al_Maki_(محمد_رمضان_سعد_-_الحرم_المكي).mp3" "assets/adhan/adhan_muhammad_ramadan_saad.mp3"
          download_adhan "Ali_Ibn_Ahmad_Mala_1_-_Al_Haram_Al_Maki_(علي_بن_أحمد_ملا_-_الحرم_المكي).mp3" "assets/adhan/adhan_ali_ibn_ahmad_mala.mp3"
          download_adhan "Muhammad_Khaleel_Raml_-_Al_Haram_Al_Maki_(محمد_خليل_رمل_-_الحرم_المكي).mp3" "assets/adhan/adhan_muhammad_khaleel_raml.mp3"
          download_adhan "Nayf_Fedah_-_Al_Haram_Al_Maki_(نايف_فداح_-_الحرم_المكي).mp3" "assets/adhan/adhan_nayf_fedah.mp3"
          download_adhan "Faruq_Abdul_Rahman_Hadrawe_-_Al_Haram_Al_Maki_(فاروق_عبدالرحمن_حضراوي_-_الحرم_المكي).mp3" "assets/adhan/adhan_faruq_abdul_rahman_hadrawe.mp3"
          download_adhan "Assem_Bukhrare_-_Al_Haram_Al_Maki_(عاصم_بخراري_-_الحرم_المكي).mp3" "assets/adhan/adhan_assem_bukhrare.mp3"
          download_adhan "NurDin_Hamza_Al_Maghriby_-_Al_Aqsa_Jerusalem_(نور_الدين_حمزة_المغربي_-_المسجد_الأقصى_القدس).mp3" "assets/adhan/adhan_nurdin_hamza_al_maghriby.mp3"
          download_adhan "Najee_Qazaz_-_Al_Aqsa_Jerusalem_(ناجي_قزاز_-_المسجد_الأقصى_القدس).mp3" "assets/adhan/adhan_najee_qazaz.mp3"
          download_adhan "Mishary_Rashid_Alafasy_1_-_Kuwait_(مشاري_راشد_العفاسي_-_الكويت).mp3" "assets/adhan/adhan_mishary_rashid_alafasy.mp3"
          download_adhan "Abdulbasit_Abdusamad_1_-_Egypt_(عبد_الباسط_عبد_الصمد_-_مصر).mp3" "assets/adhan/adhan_abdulbasit_abdusamad.mp3"
          cp assets/adhan/*.mp3 android/app/src/main/res/raw/
          test "$(find assets/adhan -maxdepth 1 -type f -name '*.mp3' | wc -l)" -eq 10
          for audio in assets/adhan/*.mp3 android/app/src/main/res/raw/*.mp3; do
            test -s "$audio"
            file --mime-type "$audio" | grep -q 'audio/mpeg'
          done
      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Build signed release APKs and Play Store bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi
          flutter build appbundle --release

      - name: Inspect APK contents and create checksums
        shell: bash
        run: |
          set -euo pipefail
          cd build/app/outputs
          ls -lh flutter-apk/*.apk bundle/release/*.aab
          python3 - <<'PY'
          import glob
          import zipfile
          for path in glob.glob("flutter-apk/*.apk") + glob.glob("bundle/release/*.aab"):
              print(f"=== Largest entries: {path} ===")
              with zipfile.ZipFile(path) as archive:
                  entries = sorted(archive.infolist(), key=lambda item: item.file_size, reverse=True)[:15]
                  for item in entries:
                      print(f"{item.file_size:>12}  {item.filename}")
          PY
          cd flutter-apk
          sha256sum *.apk ../bundle/release/*.aab > SHA256SUMS.txt

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dhker-android-apks-by-abi
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
            build/app/outputs/flutter-apk/SHA256SUMS.txt
          retention-days: 30

      - name: Publish official v1.0.0 release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(build/app/outputs/flutter-apk/*.apk build/app/outputs/bundle/release/*.aab build/app/outputs/flutter-apk/SHA256SUMS.txt)
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 "${files[@]}" --clobber
          else
            gh release create v1.0.0 "${files[@]}" \
              --title "ذِكر v1.0.0" \
              --notes "الإصدار الرسمي الأول من تطبيق ذِكر. يتضمن ملفات APK منفصلة حسب معمارية Android وملف Android App Bundle للنشر عبر Google Play. تم بناء الإصدار بعد اجتياز التحليل والاختبارات."
          fi

